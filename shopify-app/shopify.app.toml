# Shopify app config for Oasis Agent (standalone, non-embedded).
# Push changes with: pnpm shopify:deploy
client_id = "17b40465eb97ed9f6cd725473cbe5bdb"
name = "Oasis Agent"
application_url = "http://localhost:3000"
embedded = false

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2027-01"

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_customers,write_customers,read_inventory,write_inventory,read_locations,read_discounts,write_discounts,read_draft_orders,write_draft_orders,read_reports,read_themes,write_themes,read_online_store_pages,write_online_store_pages,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_publications,write_publications"

[auth]
redirect_urls = [ "http://localhost:3000/api/auth/callback" ]
